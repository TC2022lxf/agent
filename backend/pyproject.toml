[project]
name = "ecommerce-ai-backend"
version = "0.1.0"
description = "Ecommerce AI backend: agent runtime, tools, collaboration service, API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pillow>=10.3",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pymysql>=1.1",
  "langgraph>=1.0,<2",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3",
  "mcp>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["constraints/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call a paid vendor. Always use `pytest -m "not live"` for offline runs.
# Registering markers does not configure a default exclusion.
markers = ["live: calls the real model vendor", "serial: must not run in parallel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM102"]  # B008: FastAPI Depends()/File() defaults are the idiom

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
