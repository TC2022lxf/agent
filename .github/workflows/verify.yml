name: Workspace verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GATEWAY: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Offline regression (never call paid providers)
        working-directory: backend
        run: python -m pytest -m "not live" -q
      - name: Generated references
        run: python backend/scripts/gen_docs.py --check
      - name: Shared workspace documents
        run: python scripts/check_docs.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
